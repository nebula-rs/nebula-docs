[package]
name = "docs-app"
description = "Documentação pública do leptos-nebula (feita com o leptos-press)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "docs-app"
path = "src/main.rs"
required-features = ["ssr"]

[[bin]]
name = "press-static"
path = "src/bin/press_static.rs"

[features]
csr     = ["leptos/csr", "leptos-press/csr"]
hydrate = ["leptos/hydrate", "leptos-press/hydrate"]
ssr     = ["leptos/ssr", "leptos-press/ssr", "leptos_meta/ssr", "leptos_router/ssr", "dep:leptos_axum", "dep:tokio"]

[dependencies]
leptos                   = { workspace = true }
leptos_meta              = { workspace = true }
leptos_router            = { workspace = true }
leptos-nebula                = { workspace = true }
leptos-press             = { workspace = true }
wasm-bindgen             = { workspace = true }
console_error_panic_hook = { workspace = true }
leptos_axum              = { workspace = true, optional = true }
tokio                    = { workspace = true, optional = true, features = ["rt-multi-thread", "macros"] }

[build-dependencies]
leptos-press-build = { workspace = true }
proc-macro2        = { workspace = true }
quote              = { workspace = true }
# `preserve_order`: as tabelas de API saem na ordem em que foram escritas
serde_json         = { workspace = true, features = ["preserve_order"] }

# `cargo leptos build` + o bin `docs-app` (SSG).
[package.metadata.leptos]
output-name = "docs-app"
# cargo-leptos resolve o site-root a partir da raiz do workspace
site-root = "apps/docs/dist/site"
site-pkg-dir = "pkg"
bin-target = "docs-app"
bin-features = ["ssr"]
lib-features = ["hydrate"]
lib-profile-release = "release"
